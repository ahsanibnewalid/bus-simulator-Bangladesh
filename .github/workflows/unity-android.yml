name: Unity Android (licensed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity activation configuration
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo 'Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD for your licensed GameCI environment, or build locally in Unity Hub.'
            exit 1
          fi
      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: UnityProject
          unityVersion: 6000.0.60f1
          testMode: editmode
          artifactsPath: unity-test-results
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: UnityProject
          unityVersion: 6000.0.60f1
          targetPlatform: Android
          buildMethod: Nusantara.Editor.ProjectBuilder.BuildAndroid
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unity-Test-Results
          path: unity-test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Nusantara-Heavy-Unity-Android
          path: UnityProject/Builds/Android/NusantaraHeavy.apk
          if-no-files-found: error
