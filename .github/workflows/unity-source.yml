name: Unity source checks
on:
  push:
    paths: ['UnityProject/**', 'tools/**', '.github/workflows/unity-source.yml']
  pull_request:
    paths: ['UnityProject/**', 'tools/**', '.github/workflows/unity-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-source-check.txt
      - run: python tools/check_unity_source.py
